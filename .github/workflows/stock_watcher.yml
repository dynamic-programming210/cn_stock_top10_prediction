# Stock Watcher Workflow
# Triggers when input.txt is updated, manually, or after main workflow

name: Stock Watcher

on:
  push:
    paths:
      - 'inputs/input.txt'
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update watcher predictions'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
  workflow_run:
    workflows: ["Update Predictions"]
    types:
      - completed

concurrency:
  group: stock-watcher-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  run-stock-watcher:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' || 
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Check required data files
        id: check-data
        run: |
          echo "Checking required data files..."
          
          # Check for feat_z.parquet (correct filename from config.py)
          if [ -f data/feat_z.parquet ]; then
            echo "✅ feat_z.parquet found"
            echo "has_features=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ feat_z.parquet not found, will build"
            echo "has_features=false" >> $GITHUB_OUTPUT
          fi
          
          if [ -f models/ranker.txt ] && [ -f models/regressor.pkl ]; then
            echo "✅ Model files found"
          else
            echo "❌ Model files missing!"
            exit 1
          fi
          
          if [ -f data/bars.parquet ]; then
            echo "✅ bars.parquet found"
          else
            echo "❌ bars.parquet missing!"
            exit 1
          fi
      
      - name: Build features if needed
        if: steps.check-data.outputs.has_features != 'true'
        run: |
          echo "Building features from bars data..."
          python -c "
          import sys
          sys.path.insert(0, '.')
          from features.build_features import build_features
          from config import BARS_FILE, FEATURES_Z_FILE
          import pandas as pd
          
          print('Loading bars...')
          bars = pd.read_parquet(BARS_FILE)
          print(f'Bars: {len(bars)} rows')
          
          print('Building features...')
          features = build_features(bars, save=False, zscore=True)
          print(f'Features: {len(features)} rows')
          
          features.to_parquet(FEATURES_Z_FILE, index=False)
          print('Done!')
          "
      
      - name: Check input file
        run: |
          if [ -f inputs/input.txt ]; then
            echo "📋 Watch list:"
            cat inputs/input.txt
          else
            echo "❌ No input.txt found"
            exit 1
          fi
      
      - name: Run Stock Watcher
        run: |
          python models/stock_watcher.py
      
      - name: Upload watcher results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watcher-predictions
          path: |
            outputs/watcher_predictions.parquet
            outputs/watcher_history.parquet
          retention-days: 30
          if-no-files-found: warn
      
      - name: Commit results
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          
          if [ -f outputs/watcher_predictions.parquet ]; then
            git add outputs/watcher_predictions.parquet outputs/watcher_history.parquet || true
            
            if git diff --staged --quiet; then
              echo "No changes to commit"
            else
              git commit -m "🔄 Update stock watcher predictions [skip ci]"
              git push
            fi
          else
            echo "⚠️ No watcher predictions generated"
          fi
